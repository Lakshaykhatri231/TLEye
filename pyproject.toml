[project]
name = "tleye"
version = "0.1.0"
description = "TLE verifier for competitive-programming solutions with sandbox-confirmed certificates"
requires-python = ">=3.10"
dependencies = [
  "pandas",
  "pyarrow",
  "numpy",
  "scikit-learn",
  "lightgbm",
  "tree-sitter",
  "tree-sitter-cpp",
  "tree-sitter-java",
  "tree-sitter-python",
  "beautifulsoup4",
  "tqdm",
]

[project.optional-dependencies]
dev = ["pytest", "ruff"]
train = ["torch", "transformers", "peft", "datasets", "accelerate"]
demo = ["gradio"]

[tool.setuptools.packages.find]
include = ["tleye*"]

[tool.ruff]
line-length = 120
extend-exclude = ["kaggle"]   # scripts are hashed in run.json; never auto-format them

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]   # errors, pyflakes, import order (pragmatic CI gate)
ignore = ["E702", "E741"]               # analysis scripts use one-line `a; b` and short names deliberately

[tool.pytest.ini_options]
testpaths = ["tests"]
