name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      TLEYE_SKIP_DOCKER: "1"      # the sandbox tests run in their own job below
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - run: ruff check .
      # unit tests + the AUROC regression gate (tests/test_ci_gate.py: frozen fixture, committed model, ci/baseline_eval.json)
      - run: pytest -q

  sandbox:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e ".[dev]"
      - name: Build and pull the sandbox images
        run: make sandbox-images
      # certified / not certified / crash / compile error / no network / missing library, run in the real Docker sandbox
      - run: pytest -q tests/test_runner.py
